<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account — Masket</title>
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>

<nav class="navbar">
  <div class="container navbar-inner">
    <a href="/index.html" class="navbar-logo"><i class="ri-shopping-bag-3-fill"></i> Mas<span>ket</span></a>
    <ul class="nav-links">
      <li><a href="/index.html"><i class="ri-home-4-line"></i> Home</a></li>
      <li><a href="/contact.html"><i class="ri-customer-service-2-line"></i> Contact</a></li>
      <li>
        <a href="/cart.html" class="nav-cart-badge">
          <i class="ri-shopping-cart-2-line"></i> Cart
          <span class="nav-cart-count" style="display:none">0</span>
        </a>
      </li>
      <li><a href="/profile.html" class="active"><i class="ri-user-3-fill"></i> My Account</a></li>
    </ul>
    <div class="navbar-actions">
      <button class="dark-toggle"><i class="ri-moon-line"></i></button>
    </div>
  </div>
</nav>

<div class="page-wrapper">

  <!-- Profile Header -->
  <div class="profile-header">
    <div class="container">
      <div style="display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:20px">
        <div style="display:flex;align-items:center;gap:20px">
          <div class="profile-avatar" id="profile-avatar">U</div>
          <div>
            <h2 class="profile-name" id="profile-name">Loading...</h2>
            <div class="profile-email" id="profile-email">—</div>
            <div class="profile-meta">
              <span class="profile-meta-item"><i class="ri-map-pin-line"></i> <span id="profile-residence">—</span></span>
              <span class="profile-meta-item"><i class="ri-user-line"></i> <span id="profile-gender">—</span></span>
              <span class="profile-meta-item"><i class="ri-phone-line"></i> <span id="profile-phone">—</span></span>
              <span class="profile-meta-item"><i class="ri-calendar-line"></i> Joined <span id="profile-joined">—</span></span>
            </div>
          </div>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <!-- Admin Button (only shown for admin) -->
          <a href="/admin.html" id="admin-panel-btn" class="btn" style="display:none;background:linear-gradient(135deg,#FFD700,#FFA500);color:#000;font-weight:700">
            <i class="ri-dashboard-3-line"></i> Admin Panel
          </a>
          <button onclick="openModal('edit-profile-modal')" class="btn btn-outline" style="border-color:rgba(255,255,255,0.3);color:#fff">
            <i class="ri-edit-line"></i> Edit Profile
          </button>
          <button id="logout-btn" onclick="doLogout()" class="btn btn-ghost" style="background:rgba(239,68,68,0.15);color:#f87171;border:none">
            <i class="ri-logout-box-line"></i> Logout
          </button>
        </div>
      </div>
    </div>
  </div>

  <section class="section" style="padding-top:32px">
    <div class="container">
      <div style="display:grid;grid-template-columns:300px 1fr;gap:28px;align-items:start">

        <!-- Left: Profile Details Card -->
        <div>
          <div class="card mb-3">
            <div class="card-header">
              <h3 style="font-size:16px"><i class="ri-user-settings-line"></i> Account Details</h3>
            </div>
            <div class="card-body">
              <div style="display:flex;flex-direction:column;gap:16px">
                <div>
                  <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);margin-bottom:3px">Full Name</div>
                  <div style="font-weight:600" id="detail-name">—</div>
                </div>
                <div>
                  <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);margin-bottom:3px">Email</div>
                  <div id="detail-email">—</div>
                </div>
                <div>
                  <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);margin-bottom:3px">Phone</div>
                  <div id="detail-phone">—</div>
                </div>
                <div>
                  <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);margin-bottom:3px">Residence</div>
                  <div id="detail-residence">—</div>
                </div>
                <div>
                  <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);margin-bottom:3px">Gender</div>
                  <div id="detail-gender">—</div>
                </div>
              </div>
            </div>
          </div>

          <!-- Quick links -->
          <div class="card">
            <div class="card-body" style="padding:10px 0">
              <a href="/index.html" class="admin-nav-item"><i class="ri-shopping-bag-3-line"></i> Continue Shopping</a>
              <a href="/cart.html" class="admin-nav-item"><i class="ri-shopping-cart-2-line"></i> My Cart</a>
              <a href="/contact.html" class="admin-nav-item"><i class="ri-customer-service-2-line"></i> Contact Support</a>
            </div>
          </div>
        </div>

        <!-- Right: Orders -->
        <div>
          <div style="display:flex;align-items:center;justify-content:space-between;margin-top:20px">
            <h2 style="font-size:22px">My Orders</h2>
          </div>
          <div id="orders-loading" class="loading-overlay"><div class="spinner"></div></div>
          <div id="orders-container">
            <!-- JS populated -->
          </div>
        </div>
      </div>
    </div>
  </section>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <div class="bottom-nav-inner">
    <a href="/index.html" class="bnav-item"><i class="ri-home-4-line"></i> Home</a>
    <a href="/contact.html" class="bnav-item"><i class="ri-customer-service-2-line"></i> Contact</a>
    <a href="/cart.html" class="bnav-item bnav-cart">
      <i class="ri-shopping-cart-2-line"></i>
      <span class="bnav-cart-count" style="display:none">0</span>
      Cart
    </a>
    <a href="/profile.html" class="bnav-item active"><i class="ri-user-3-fill"></i> Account</a>
  </div>
</nav>

<!-- EDIT PROFILE MODAL -->
<div class="modal-overlay" id="edit-profile-modal">
  <div class="modal">
    <div class="modal-header">
      <h3><i class="ri-edit-line" style="color:var(--blue)"></i> Edit Profile</h3>
      <button class="modal-close" onclick="closeModal('edit-profile-modal')"><i class="ri-close-line"></i></button>
    </div>
    <div class="modal-body">
      <form id="edit-profile-form">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input id="edit-name" type="text" class="form-control" required>
        </div>
        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <input id="edit-phone" type="tel" class="form-control" placeholder="+254 7XX XXX XXX">
        </div>
        <div class="form-group">
          <label class="form-label">Residence / Location</label>
          <input id="edit-residence" type="text" class="form-control" placeholder="Nairobi, Kenya">
        </div>
        <div class="form-group">
          <label class="form-label">Gender</label>
          <select id="edit-gender" class="form-control">
            <option value="">Prefer not to say</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="modal-footer" style="padding:0;border:none;margin-top:8px">
          <button type="button" class="btn btn-ghost" onclick="closeModal('edit-profile-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary"><i class="ri-save-line"></i> Save Changes</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/profile.js"></script>
</body>
</html>
